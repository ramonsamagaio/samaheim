name: Apply Enemy Variety

on:
  push:
    branches:
      - work/enemy-variety
    paths:
      - tools/apply-enemy-variety.py
      - .github/workflows/apply-enemy-variety.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/enemy-variety
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply regional enemy variety
        run: python tools/apply-enemy-variety.py
      - name: Commit integration
        run: |
          if git diff --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main/java/com/samaheim/SamaheimCaveGame.java
          git commit -m "Integrate region-driven enemy variety"
          git push origin HEAD:work/enemy-variety
