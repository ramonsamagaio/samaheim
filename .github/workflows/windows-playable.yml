name: Windows Playable

on:
  push:
    branches: [ main, 'work/**' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  windows-playable:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build, test and package Samaheim.exe
        shell: pwsh
        run: ./tools/package-windows.ps1
      - name: Upload Windows playable
        uses: actions/upload-artifact@v4
        with:
          name: Samaheim-Windows
          path: build/Samaheim-Windows.zip
          if-no-files-found: error
          retention-days: 14
