name: Apply Frontier POIs

on:
  push:
    branches: [ 'work/frontier-pois' ]
    paths:
      - 'tools/apply-frontier-pois.py'
      - '.github/workflows/apply-frontier-pois.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/frontier-pois
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply POI runtime integration
        run: python tools/apply-frontier-pois.py
      - name: Commit integration
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main/java/com/samaheim/SamaheimCaveGame.java
          git diff --cached --quiet && exit 0
          git commit -m "Integrate persistent frontier POIs"
          git push origin HEAD:work/frontier-pois
