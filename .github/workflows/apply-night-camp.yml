name: Apply Night Camp Pressure

on:
  push:
    branches:
      - work/night-camp-pressure
    paths:
      - tools/apply-night-camp.py
      - .github/workflows/apply-night-camp.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/night-camp-pressure
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply night pressure and campfire integration
        run: python tools/apply-night-camp.py
      - name: Commit integration
        run: |
          if git diff --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main/java/com/samaheim/SamaheimCaveGame.java
          git commit -m "Integrate night pressure and campfire rest"
          git push origin HEAD:work/night-camp-pressure
