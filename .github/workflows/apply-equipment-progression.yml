name: Apply Equipment Progression

on:
  push:
    branches: [ 'work/equipment-progression' ]
    paths:
      - 'tools/apply-equipment-progression.py'
      - '.github/workflows/apply-equipment-progression.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/equipment-progression
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply equipment runtime integration
        run: python tools/apply-equipment-progression.py
      - name: Commit integration
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main/java/com/samaheim/SamaheimCaveGame.java
          git diff --cached --quiet && exit 0
          git commit -m "Integrate region-driven equipment progression"
          git push origin HEAD:work/equipment-progression
